steps:
- name: 'gcr.io/cloud-builders/docker'
  args:
    - build
    - '-t'
    - 'gcr.io/$PROJECT_ID/github.com/satyanathsatyanath/gcptest:$SHORT_SHA'
    - '.'

- name: 'gcr.io/cloud-builders/docker'
  args:
    - push
    - 'gcr.io/$PROJECT_ID/github.com/satyanathsatyanath/gcptest:$SHORT_SHA'

- name: 'ubuntu'
  entrypoint: bash
  args:
    - '-c'
    - |
      sed -i "s|IMAGE_TAG|$SHORT_SHA|g" kubernetes/deploy.yaml

- name: 'gcr.io/cloud-builders/kubectl'
  env:
    - CLOUDSDK_COMPUTE_ZONE=us-central1-a
    - CLOUDSDK_CONTAINER_CLUSTER=cicd-cluster
  args:
    - apply
    - -f
    - kubernetes/deploy.yaml

options:
  logging: CLOUD_LOGGING_ONLY