steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', 'asia-south1-docker.pkg.dev/satyanewproject-498206/python-aap-image/hello-app:v1', '.']

#push the image to artifact registry
  - name: gcr.io/cloud-builders/docker
    args: ['push', 'asia-south1-docker.pkg.dev/satyanewproject-498206/python-aap-image/hello-app:v1']

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: 'Deploy to Cloud Run'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "Deploying the application to Cloud Run..."
        gcloud run deploy hello-app \
          --image asia-south1-docker.pkg.dev/satyanewproject-498206/python-aap-image/hello-app:v1 \
          --region asia-south1 \
          --platform managed \
          --allow-unauthenticated \
          --port 8000
        echo "Deployment completed successfully!"

images:
 - 'asia-south1-docker.pkg.dev/satyanewproject-498206/python-aap-image/hello-app:v1'

options:
  logging: CLOUD_LOGGING_ONLY