apiVersion: apps/v1
kind: Deployment

metadata:
  name: deployment-1

spec:
  replicas: 1

  selector:
    matchLabels:
      app: deployment-1
  template:
    metadata:
      labels:
        app: deployment-1
    spec:
      containers:
      - name: gcptest
        image: gcr.io/satyanewproject-498206/github.com/satyanathsatyanath/gcptest:latest
        ports:
        - containerPort: 8080
